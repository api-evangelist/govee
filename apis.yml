aid: govee
url: https://raw.githubusercontent.com/api-evangelist/govee/refs/heads/main/apis.yml
name: Govee
kind: company
description: Govee builds smart lighting and smart-home devices - RGBIC LED strips,
  light bars, floor and table lamps, string and permanent outdoor lights, plus
  sensors, humidifiers, heaters, and other connected appliances. The Govee
  Developer API (v1, hosted at https://openapi.api.govee.com/router/api/v1) is a
  free, cloud REST API authenticated with a Govee-API-Key header that lets
  developers enumerate a user's devices and their capabilities, query live device
  state, and send control commands - power, brightness, RGB and color-temperature,
  dynamic light scenes, DIY scenes, and per-segment color and brightness. Device
  events (for capabilities that support them) are delivered over MQTT, and a
  separate local LAN API allows direct UDP control on the local network.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Smart Home
- Smart Lighting
- IoT
- LED
- Home Automation
- Device Control
