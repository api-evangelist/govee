apis:
- aid: govee:govee-devices-api
  name: Govee Devices API
  tags:
  - Devices
  - Discovery
  - Capabilities
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.govee.com/reference/get-you-devices
  baseURL: https://openapi.api.govee.com/router/api/v1
  properties:
  - url: https://developer.govee.com/docs/getting-started
    type: Documentation
  - url: https://developer.govee.com/reference/get-you-devices
    type: APIReference
  - url: openapi/govee-openapi.yml
    type: OpenAPI
  - url: collections/govee.postman_collection.json
    type: PostmanCollection
  - url: collections/govee.opencollection.json
    type: OpenCollection
  description: Enumerate all supported devices in a Govee account and discover each
    device's capabilities - the sku (product model), device id, user-assigned name,
    and the typed capability list (on_off, range/brightness, color_setting,
    segment_color_setting, dynamic scenes, and more) that tells you what commands a
    device accepts.
- aid: govee:govee-device-state-api
  name: Govee Device State API
  tags:
  - Device State
  - Query
  - Status
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.govee.com/reference/get-devices-status
  baseURL: https://openapi.api.govee.com/router/api/v1
  properties:
  - url: https://developer.govee.com/reference/get-devices-status
    type: APIReference
  - url: openapi/govee-openapi.yml
    type: OpenAPI
  - url: collections/govee.postman_collection.json
    type: PostmanCollection
  - url: collections/govee.opencollection.json
    type: OpenCollection
  description: Query the current state and property values of a specific device by
    sku and device id - power, online status, brightness, color, color temperature,
    and other capability states. Offline devices return their last known
    (historical) state; event-only capabilities cannot be queried directly.
- aid: govee:govee-device-control-api
  name: Govee Device Control API
  tags:
  - Device Control
  - Commands
  - Power
  - Color
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.govee.com/reference/control-you-devices
  baseURL: https://openapi.api.govee.com/router/api/v1
  properties:
  - url: https://developer.govee.com/reference/control-you-devices
    type: APIReference
  - url: openapi/govee-openapi.yml
    type: OpenAPI
  - url: collections/govee.postman_collection.json
    type: PostmanCollection
  - url: collections/govee.opencollection.json
    type: OpenCollection
  description: Send control commands to a device by passing a single typed capability
    - turn power on/off (on_off/powerSwitch), set brightness (range), set an RGB
    color or Kelvin color temperature (color_setting), toggle features
    (nightlight, oscillation), select a mode, or drive work_mode and
    temperature_setting capabilities on appliances.
- aid: govee:govee-dynamic-scenes-api
  name: Govee Dynamic Scenes API
  tags:
  - Scenes
  - Light Scenes
  - Effects
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.govee.com/reference/get-light-scene
  baseURL: https://openapi.api.govee.com/router/api/v1
  properties:
  - url: https://developer.govee.com/reference/get-light-scene
    type: APIReference
  - url: openapi/govee-openapi.yml
    type: OpenAPI
  - url: collections/govee.postman_collection.json
    type: PostmanCollection
  - url: collections/govee.opencollection.json
    type: OpenCollection
  description: Retrieve the list of dynamic (light) scenes a device supports -
    Govee's built-in lighting effects such as Sunrise, Aurora, or Rainbow - each
    returned as a selectable option that can then be applied through the Device
    Control API's dynamic_scene capability.
- aid: govee:govee-diy-scenes-api
  name: Govee DIY Scenes API
  tags:
  - DIY Scenes
  - Custom Effects
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.govee.com/reference/control-you-devices
  baseURL: https://openapi.api.govee.com/router/api/v1
  properties:
  - url: https://developer.govee.com/reference/control-you-devices
    type: APIReference
  - url: openapi/govee-openapi.yml
    type: OpenAPI
  - url: collections/govee.postman_collection.json
    type: PostmanCollection
  - url: collections/govee.opencollection.json
    type: OpenCollection
  description: Retrieve the user-created DIY scenes a device supports - custom
    lighting effects authored by the user in the Govee Home App - each returned as
    a selectable option that can then be applied through the Device Control API's
    diy_scene capability.
- aid: govee:govee-segment-control-api
  name: Govee Segment Color and Brightness API
  tags:
  - Segment Control
  - RGBIC
  - Color
  - Brightness
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.govee.com/reference/control-you-devices
  baseURL: https://openapi.api.govee.com/router/api/v1
  properties:
  - url: https://developer.govee.com/reference/control-you-devices
    type: APIReference
  - url: openapi/govee-openapi.yml
    type: OpenAPI
  - url: collections/govee.postman_collection.json
    type: PostmanCollection
  - url: collections/govee.opencollection.json
    type: OpenCollection
  description: Address individual segments of RGBIC lights independently via the
    Device Control endpoint's segment_color_setting capability - set per-segment RGB
    color (segmentedColorRgb) or per-segment brightness (segmentedBrightness) by
    passing the target segment index array plus the color or brightness value.
