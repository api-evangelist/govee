description: >-
  FinOps view of Govee Developer API spend. The API itself carries no usage
  charge - there is no metered billing, no subscription, and no per-call fee for
  the cloud REST API or the local LAN API. The only monetary cost associated with
  the platform is the purchase of Govee hardware (one-time capital cost of the
  devices being controlled). Consequently, "cost management" for the Govee API is
  really quota management: staying within the 10,000 requests/account/day limit
  and the per-device per-minute limit, since there is no way to pay to raise them.
  Optimization is therefore about call efficiency (caching state, subscribing to
  MQTT events, using the LAN API for high-frequency control) rather than dollar
  spend.
notes: >-
  No invoice is issued for API usage, so FOCUS billing columns are effectively
  zero-cost. The dominant (and only) real cost is hardware acquisition. Meters
  below track request consumption against the free daily quota, not currency.
