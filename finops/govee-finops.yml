publisherName: Govee
serviceCategory: IoT and Smart Home
billingModel:
  pricingCategory: Free
  billingFrequency: None
  billingCurrency: USD
  chargeCategories:
  - Usage
meters:
- name: account_requests
  description: Cloud REST API requests counted against the 10,000 per-account-per-day quota (no charge, quota only).
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - endpoint
- name: per_device_requests
  description: Requests per device per minute, bounded by the per-device rate limit (no charge, quota only).
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - device
- name: hardware_capital
  description: One-time purchase cost of Govee devices - the only real monetary cost tied to the platform.
  unit: devices
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track daily request consumption per API key against the 10,000/day quota and watch API-RateLimit-* headers.
- name: Allocation
  description: Attribute request volume to specific devices and integrations so quota pressure maps to the workload causing it.
- name: Optimization
  description: Cache device state, subscribe to MQTT device events instead of polling, and use the local LAN API for high-frequency control to conserve the daily quota.
- name: Accountability
  description: Since quota cannot be purchased up, owners must design integrations to live within the free limits rather than budget for overage.
